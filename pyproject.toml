[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-trading-lab"
version = "0.1.0"
description = "An educational event-driven market-making and inventory-risk simulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Phawat Saengsiripongpun"}]
license = {text = "MIT"}

[project.scripts]
trading-lab = "trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
